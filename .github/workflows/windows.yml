
name: Windows Release Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE 8.0.13
        run: git clone --depth 1 --branch 8.0.13 https://github.com/juce-framework/JUCE.git lib/JUCE

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure Release
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets
        run: cmake --build build-release

      - name: Run tests
        run: ctest --test-dir build-release --output-on-failure

      - name: Package Cadenza
        shell: pwsh
        run: ./scripts/package.ps1 -BuildDir build-release -OutDir dist -Zip

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: Cadenza-Windows-Release
          path: dist/Cadenza-*.zip
          if-no-files-found: error
          retention-days: 14
